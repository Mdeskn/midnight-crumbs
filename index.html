<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Midnight Crumbs: a cat-and-mouse game for two phones. Sneak for cheese, sniff out crumbs, pounce.">
<meta name="theme-color" content="#12163a">

<title>Midnight Crumbs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one screen. Scores on top, the house in the middle, your trick cards and buttons at the bottom. */
:root {
  --night: #12163a;
  --night-2: #1d2560;
  --rail: #2f3878;
  --deep: #080a1f;
  --ink: #1d1838;
  --paper: #fff6e2;
  --muted: #aeb4e0;
  --cheese: #ffc93c;
  --tomato: #ff5a3c;
  --mint: #5fe0b4;
  --pink: #ff6fa5;
  --lav: #b9a6ff;
  --display: 'Fredoka', 'Arial Rounded MT Bold', ui-rounded, sans-serif;
  --body: 'Nunito', ui-rounded, 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  background-image: radial-gradient(circle at 50% 28%, var(--night-2) 0, var(--night) 72%);
  color: var(--paper);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; }
#app {
  height: 100%;
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
}
.top { display: flex; align-items: center; gap: 10px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 18px; color: var(--cheese); }
.chip {
  margin-left: auto; font-size: 12px; font-weight: 700; letter-spacing: .03em;
  padding: 4px 10px; border-radius: 99px; background: var(--rail); color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%;
}
.chip.good { background: #1f4d43; color: var(--mint); }
.chip.warn { background: #4d3b14; color: var(--cheese); }
.chip.bad { background: #5a1d1d; color: #ffb4a6; }
.iconbtn {
  border: 2px solid var(--rail); background: transparent; border-radius: 99px;
  font-weight: 800; font-size: 13px; padding: 4px 10px; cursor: pointer; color: var(--paper);
}
.iconbtn.exit { border-color: #6b2a2a; color: #ffb4a6; }
#screen { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; }
@media (max-width: 430px) { #app.ingame .brand { display: none; } #app.ingame .chip { margin-left: 0; margin-right: auto; } }
.req { text-transform: none; letter-spacing: 0; font-weight: 700; color: var(--cheese); margin-left: 4px; }
input.missing { border-color: var(--tomato) !important; box-shadow: 0 0 0 3px var(--tomato); }

/* Buttons */
.btn {
  font-family: var(--display); font-weight: 600; font-size: 17px; line-height: 1.1;
  color: var(--ink); background: var(--cheese);
  border: 3px solid var(--ink); border-radius: 14px; padding: 10px 12px; min-height: 52px;
  box-shadow: 0 4px 0 var(--deep); cursor: pointer;
  transition: transform .06s, box-shadow .06s;
}
.btn:active:not([disabled]) { transform: translateY(3px); box-shadow: 0 1px 0 var(--deep); }
.btn.hot { background: var(--tomato); color: var(--paper); }
.btn.ghost { background: transparent; color: var(--paper); border-color: var(--rail); box-shadow: none; }
.btn.ghost.ink { color: var(--ink); border-color: var(--ink); }
.btn.on { background: var(--pink); color: var(--ink); }
.btn.small { min-height: 40px; font-size: 15px; padding: 8px 14px; }
.btn.big { min-height: 58px; font-size: 20px; }
.btn[disabled] { opacity: .42; cursor: default; box-shadow: none; }
.link { background: none; border: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 10px; font-weight: 700; }
:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }

/* Lobby */
.lobby, .wait { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding-top: 4px; }
.hero { width: min(300px, 82vw); height: auto; margin: 2px 0 -6px; }
.hero .bob { animation: bob 2.6s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px); } }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(36px, 11vw, 50px); line-height: .95; margin: 0; color: var(--paper); text-wrap: balance; text-shadow: 0 4px 0 var(--deep); }
.lede { margin: 0; color: var(--muted); max-width: 34ch; text-wrap: balance; }
.form { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 10px; text-align: left; margin-top: 6px; }
.form label { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
input#name, input#code {
  width: 100%; font: inherit; font-size: 17px; font-weight: 700; color: var(--ink); background: var(--paper);
  border: 3px solid var(--ink); border-radius: 12px; padding: 12px 14px; min-height: 52px;
}
input#code { font-family: var(--display); font-weight: 700; letter-spacing: .25em; text-transform: uppercase; text-align: center; }
.or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; margin: 4px 0; }
.or::before, .or::after { content: ""; flex: 1; height: 2px; background: var(--rail); }
.joinrow { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
.joinrow .btn { padding-inline: 22px; }
.warn { background: #4d1f1a; color: #ffd2c9; border-radius: 12px; padding: 10px 14px; margin: 0; max-width: 360px; font-size: 14px; }
.notice { margin: 0; padding: 6px 12px; border-radius: 12px; background: #4d3b14; color: var(--cheese); font-size: 13px; font-weight: 700; text-align: center; }
.seats { list-style: none; margin: 0; padding: 0; width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 6px; }
.seats li { background: rgba(8,10,31,.4); border-radius: 10px; padding: 8px 12px; font-weight: 700; text-align: left; }
.seats li.open { color: var(--muted); border: 2px dashed var(--rail); background: none; }
.you { font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; background: var(--rail); color: var(--muted); padding: 1px 7px; border-radius: 99px; margin-left: 4px; }
.fine { color: var(--muted); font-size: 13px; margin: 0; }
.eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 18px 0 0; }
.eyebrow.ink { color: #6d6488; margin-top: 6px; }
.bigcode { font-family: var(--display); font-weight: 700; font-size: clamp(56px, 18vw, 78px); letter-spacing: .12em; color: var(--cheese); text-shadow: 0 5px 0 var(--deep); line-height: 1; padding-left: .12em; }
.coderow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.paws { display: flex; gap: 12px; margin: 10px 0; }
.paws i { width: 16px; height: 16px; border-radius: 50%; background: var(--cheese); animation: paw 1.2s ease-in-out infinite; }
.paws i:nth-child(2) { animation-delay: .2s; } .paws i:nth-child(3) { animation-delay: .4s; }
@keyframes paw { 0%, 100% { transform: translateY(0); opacity: .35; } 40% { transform: translateY(-8px); opacity: 1; } }

/* Table */
.card { display: block; width: 100%; height: auto; aspect-ratio: 200 / 280; }
.table { flex: 1; display: flex; flex-direction: column; gap: 8px; }
.scores { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 5px 10px 5px 6px; border-radius: 14px; background: rgba(8,10,31,.42); border: 2px solid transparent; }
.tile.active { border-color: var(--cheese); }
.face { width: 38px; height: 30px; flex: 0 0 auto; }
.who { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; min-width: 0; flex: 1; }
.nm { font-family: var(--display); font-weight: 600; font-size: 16px; line-height: 1.1; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.pill { font-size: 10.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; background: var(--rail); color: var(--muted); padding: 1px 7px; border-radius: 99px; }
.pill.mouse { background: #3d3478; color: var(--lav); }
.pill.cat { background: #5a3418; color: #ffc48a; }
.pill.awayp { background: #4d3b14; color: var(--cheese); }
.pts { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1; color: var(--cheese); font-variant-numeric: tabular-nums; }
.board { display: flex; justify-content: center; }
.map { display: block; width: 100%; height: auto; max-height: 46dvh; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.map .tap { fill: transparent; cursor: pointer; outline: none; }
.map .tap:focus-visible { stroke: var(--mint); stroke-width: 3; }
.map .hl { fill: rgba(95,224,180,.14); stroke: var(--mint); stroke-width: 3; stroke-dasharray: 7 5; animation: march 1.2s linear infinite; }
.map .hl.leap { fill: rgba(255,90,60,.14); stroke: var(--tomato); }
.map .hl.decoy { fill: rgba(255,111,165,.14); stroke: var(--pink); }
.map .hl.start { fill: rgba(185,166,255,.16); stroke: var(--lav); }
.map .pick { fill: rgba(95,224,180,.34); stroke: var(--mint); stroke-width: 4; }
.map .pick.leap { fill: rgba(255,90,60,.32); stroke: var(--tomato); }
.map .pick.start { fill: rgba(185,166,255,.34); stroke: var(--lav); }
.map .hint { fill: none; stroke: var(--cheese); stroke-width: 3; stroke-dasharray: 1 6; stroke-linecap: round; }
.map .flash { fill: none; stroke-width: 5; animation: flash .9s ease-in-out infinite; }
@keyframes march { to { stroke-dashoffset: -24; } }
@keyframes flash { 50% { opacity: .2; } }
.status { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.st-title { margin: 0; font-family: var(--display); font-weight: 700; font-size: 19px; line-height: 1.15; text-wrap: balance; }
.st-title.me { color: var(--cheese); }
.st-sub { margin: 0; font-size: 13px; color: var(--muted); text-wrap: balance; }
.clock { margin: 2px 0 0; font-size: 11.5px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.clock b { display: inline-block; min-width: 3.2ch; padding: 0 7px; border-radius: 99px; background: var(--rail); color: var(--paper); font-variant-numeric: tabular-nums; }
.clock.urgent b { background: var(--tomato); color: #fff; animation: pulse .9s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.12); } }
.logrow { display: flex; gap: 8px; align-items: stretch; }
.log { all: unset; cursor: pointer; display: block; flex: 1; min-width: 0; min-height: 2.8em; padding: 6px 10px; border-radius: 12px; background: rgba(8,10,31,.42); }
.log ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; font-size: 13px; color: var(--muted); }
.log li:last-child { color: var(--paper); font-weight: 700; }
.chatbtn { position: relative; flex: 0 0 auto; width: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 2px solid var(--rail); background: rgba(8,10,31,.42); color: var(--paper); border-radius: 12px; cursor: pointer; font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
.chatbtn svg { width: 22px; height: 22px; }
.unread { position: absolute; top: -8px; right: -6px; min-width: 22px; height: 22px; border-radius: 99px; background: var(--tomato); color: #fff; border: 2px solid var(--ink); font-style: normal; font-size: 12px; display: grid; place-items: center; padding: 0 5px; }
.handrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 10px; border-radius: 16px; background: rgba(8,10,31,.42); }
.hand { display: flex; gap: 6px; flex: 0 0 auto; }
.hand.none { font-size: 12px; font-weight: 700; color: var(--muted); width: 60px; text-align: center; line-height: 1.2; }
.tcard { position: relative; width: 50px; padding: 0; border: 0; background: none; cursor: pointer; transition: transform .14s ease; }
.tcard .card { filter: drop-shadow(0 3px 0 rgba(0,0,0,.4)); }
.tcard.sel { transform: translateY(-6px); }
.tcard.sel .card { filter: drop-shadow(0 0 0 var(--cheese)) drop-shadow(0 4px 0 var(--cheese)); }
.badge { position: absolute; top: -6px; left: -5px; background: var(--ink); color: var(--paper); border: 2px solid var(--paper); font-weight: 800; font-size: 11px; border-radius: 99px; padding: 0 6px; line-height: 18px; }
.info { margin: 0; font-size: 13px; line-height: 1.35; color: var(--paper); flex: 1 1 150px; min-width: 0; }
.info.dim { color: var(--muted); }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btns.one { grid-template-columns: 1fr; }
.waitline { grid-column: 1 / -1; margin: 0; min-height: 52px; display: grid; place-items: center; color: var(--muted); font-weight: 700; text-align: center; border: 2px dashed var(--rail); border-radius: 14px; padding: 6px 12px; }

/* Modal sheets */
#modal { position: fixed; inset: 0; z-index: 20; background: rgba(6,8,22,.74); display: flex; align-items: flex-end; justify-content: center; padding: 12px max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.sheet { width: 100%; max-width: 460px; max-height: 100%; overflow-y: auto; background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 8px 0 var(--deep); animation: rise .22s ease-out; }
@keyframes rise { from { transform: translateY(30px); opacity: 0; } }
.sheet h2 { font-family: var(--display); font-weight: 700; font-size: 27px; margin: 0; line-height: 1.05; text-wrap: balance; }
.sheet .sub { margin: 0; color: #4b4366; }
.sheet .fine { color: #6d6488; }
.sheet .btn { box-shadow: 0 4px 0 #b7a98a; }
.sheet .chipbtn { border: 2px solid var(--ink); background: #fff; border-radius: 99px; padding: 8px 14px; font-weight: 800; cursor: pointer; color: var(--ink); }
.over { text-align: center; align-items: stretch; }
.mapwrap { background: var(--night); border: 3px solid var(--ink); border-radius: 16px; padding: 4px 6px; }
.mapwrap .map { max-height: 36vh; margin: 0 auto; }
.scoreline { display: flex; justify-content: center; gap: 22px; font-weight: 800; }
.scoreline b { font-family: var(--display); font-size: 26px; vertical-align: -3px; margin-left: 4px; }
.recap { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: #4b4366; }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.rules { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.rules li { display: grid; grid-template-columns: 46px 1fr; gap: 10px; align-items: start; font-size: 14px; }
.rules .tiny { width: 46px; }
.quick { display: flex; gap: 8px; flex-wrap: wrap; }
.chatsheet { height: min(78vh, 560px); }
.chathead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.chatlist { flex: 1; min-height: 0; overflow-y: auto; list-style: none; margin: 0; padding: 4px 2px; display: flex; flex-direction: column; gap: 8px; }
.chatlist li { max-width: 82%; align-self: flex-start; background: #fff; border: 2px solid var(--ink); border-radius: 14px 14px 14px 4px; padding: 6px 10px; overflow-wrap: anywhere; }
.chatlist li b { display: block; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: #6d6488; }
.chatlist li.me { align-self: flex-end; background: var(--cheese); border-radius: 14px 14px 4px 14px; }
.chatlist li.pending { opacity: .6; }
.chatlist li.none { align-self: center; background: none; border: 0; color: #6d6488; }
.chatform { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
#chatin { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: #fff; border: 3px solid var(--ink); border-radius: 12px; padding: 10px 12px; min-height: 46px; }
.fulllog { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.fulllog li:first-child { font-weight: 800; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(132px + env(safe-area-inset-top, 0px)); z-index: 30; background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 14px; padding: 10px 14px; font-weight: 700; max-width: min(92vw, 420px); text-align: center; box-shadow: 0 4px 0 var(--deep); }
@media (max-height: 700px) {
  .map { max-height: 40dvh; }
  .st-sub { display: none; }
  .hero { width: min(220px, 60vw); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div id="app">
  <header class="top">
    <span class="brand">Midnight Crumbs</span>
    <span id="chip" class="chip">Connecting</span>
    <button class="iconbtn" data-act="rules" aria-label="How to play">Rules</button>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>

<script>// Phone-to-phone connection, shaped like the small "room" API the game uses:
// presence(obj) shares your state, peers() lists everyone, onPeers/onConnection notify changes.
// Phones talk directly over PeerJS (WebRTC) when they can. When they can't, for example when one is on
// mobile data, messages go through free public MQTT brokers instead. Neither needs an account.
(function () {
  // Optional TURN relay for networks that block direct connections, e.g.
  // { urls: 'turn:relay.example.com:443?transport=tcp', username: '…', credential: '…' }
  const TURN = [];
  // Fallback relays. Both are used at once, so the game keeps working if one is down.
  const RELAYS = ['wss://broker.hivemq.com:8884/mqtt', 'wss://broker.emqx.io:8084/mqtt'];
  const BEAT = 8000; // ms between relay heartbeats
  const EXPIRE = 25000; // ms without a relay heartbeat before a player counts as gone
  window.MC_ROOM = function () {
    const hasPeer = typeof window.Peer === 'function';
    const hasRelay = !!(window.mqtt && typeof window.mqtt.connect === 'function');
    if (!hasPeer && !hasRelay) return null;
    const PREFIX = 'midnightcrumbs-v1-';
    let mine = {}, seq = 0, rid = null, peer = null, peerUp = false, myRole = null, myCode = null;
    let online = true, retryT = 0, tries = 0, relays = [], topic = '';
    const conns = new Map(); // PeerJS id -> direct connection
    const others = new Map(); // other player's session id -> { presence, s, conn, directAt, relayAt, heard, alive }
    const peerHandlers = [], connHandlers = [], issueHandlers = [];

    // A direct line counts only while heartbeats arrive: a phone that vanishes can leave it looking open.
    const direct = (e) => !!(e.conn && e.conn.open) && Date.now() - e.directAt < EXPIRE;
    // A player is here if we heard from them recently, directly or on a relay.
    const alive = (e) => !!e.presence && (direct(e) || Date.now() - e.relayAt < EXPIRE);
    function peers() {
      const list = [{ peer: 'me', isMe: true, sameTab: true, presence: mine }];
      const live = Array.from(others.entries()).filter(([, e]) => alive(e)).sort((a, b) => b[1].heard - a[1].heard);
      for (const [id, e] of live) list.push({ peer: id, isMe: false, sameTab: false, presence: e.presence });
      return list;
    }
    const emitPeers = () => { const ps = peers(); setTimeout(() => peerHandlers.forEach((h) => h({ peers: ps })), 0); };
    const setOnline = (v) => { if (v !== online) { online = v; connHandlers.forEach((h) => h(v)); } };
    const relayUp = () => relays.some((c) => c.connected);
    const updateOnline = () => setOnline(!rid || peerUp || relayUp());
    const issue = (type) => issueHandlers.forEach((h) => h(type));

    // Use the relay until everyone we talk to has an open direct line: the host talks to every guest, a guest only to the host.
    function needRelay() {
      const live = Array.from(others.values()).filter((e) => alive(e) && e.presence.role !== mine.role);
      return !live.length || live.some((e) => !direct(e));
    }
    function publishRelay(msg) {
      const s = JSON.stringify(msg);
      for (const c of relays) if (c.connected) { try { c.publish(topic, s); } catch (e) { } }
    }
    function sendAll() {
      if (!rid) return;
      const msg = { t: 'p', id: rid, s: seq, p: mine };
      for (const c of conns.values()) if (c.open) { try { c.send(msg); } catch (e) { } }
      if (needRelay()) publishRelay(msg);
    }
    function receive(d, conn) {

        debug: 0,
        config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }, { urls: 'stun:global.stun.twilio.com:3478' }].concat(TURN) }

      p.on('error', (err) => {
        if (p !== peer) return;

    // Heartbeats on every route, and notice players who went quiet.
    setInterval(() => {
      if (!rid) return;
      for (const c of conns.values()) if (c.open) { try { c.send({ t: 'k', id: rid }); } catch (e) { } }
      if (needRelay()) publishRelay({ t: 'p', id: rid, s: seq, p: mine });

      if (!rid) return;
      for (const c of conns.values()) if (c.open) { try { c.send({ t: 'bye', id: rid }); } catch (e) { } }
      publishRelay({ t: 'bye', id: rid });
    });

    return {
      presence(patch) {
        const n = Object.assign({}, mine);
        for (const k in patch) { if (patch[k] === null || patch[k] === undefined) delete n[k]; else n[k] = patch[k]; }
        mine = n;

        ensure();
        sendAll();
        return Promise.resolve();
      },
      peers,
      onPeers(h) { peerHandlers.push(h); return () => { }; },
      onConnection(h) { connHandlers.push(h); setTimeout(() => h(online), 0); return () => { }; },
      onIssue(h) { issueHandlers.push(h); },
      connected() { return online; }

  };

<script>// Midnight Crumbs rules engine. Host-authoritative, 2 players: a mouse and a cat, who swap roles after round 1.
(function (root) {
  const TURN_MS = 90000; // ms a player has for each move before the game moves for them
  const NIGHT = 15; // turns from midnight to sunrise
  const CHEESE = 6; // cheese in the house at the start of a round
  const DELAY = 2; // turns before a crumb shows up for the cat
  const CATCH = 2; // points the cat scores for catching the mouse
  const DRAWS = [5, 10]; // turns that start with both players drawing a trick card
  const VASE = 3; // turns a knocked-over vase blocks its way

  // The house: 3 floors of 4 rooms, numbered left to right from the top floor down.
  const ROOMS = ['Attic', 'Bedroom', 'Bathroom', 'Playroom', 'Library', 'Landing', 'Music Room', 'Study', 'Pantry', 'Kitchen', 'Hallway', 'Living Room'];
  const FLOORS = ['top floor', 'middle floor', 'ground floor'];
  const DOORS = [[0, 1], [1, 2], [2, 3], [4, 5], [5, 6], [6, 7], [8, 9], [9, 10], [10, 11]];
  const STAIRS = [[1, 5], [3, 7], [6, 10]];
  const HOLES = [[0, 8], [3, 11]]; // inside the outer walls: only the mouse fits
  const STARTS = [0, 3, 8, 11]; // the mouse comes out at one end of a mouse hole
  const DEN = 5; // the cat starts on the landing
  const WALK = DOORS.concat(STAIRS), ALL = WALK.concat(HOLES);
  const MOUSE_CARDS = ['tiptoe', 'decoy', 'teacup', 'freeze'];
  const CAT_CARDS = ['whiskers', 'meow', 'vase', 'sniff'];
  const DECK = { mouse: { tiptoe: 3, decoy: 3, teacup: 2, freeze: 2 }, cat: { whiskers: 3, meow: 3, vase: 2, sniff: 2 } };
  const MASK = { stay: 'move' }; // what the cat sees in place of a mouse-only log entry

  function shuffle(a, rnd) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  const key = (a, b) => (a < b ? a + '-' + b : b + '-' + a);
  const isHole = (a, b) => HOLES.some((h) => key(h[0], h[1]) === key(a, b));
  const isBlocked = (G, a, b) => !!G && G.blocked.some((x) => key(x[0], x[1]) === key(a, b));

  // Rooms one step from r. Only the mouse fits through mouse holes, and nobody gets past a knocked-over vase.
  // G can be the game or a player's view; null ignores vases.
  function next(G, r, mouse) {
    const out = [];
    for (const [a, b] of mouse ? ALL : WALK) {
      if (a !== r && b !== r) continue;
      if (isBlocked(G, a, b)) continue;
      out.push(a === r ? b : a);
    }
    return out.sort((x, y) => x - y);
  }
  // Rooms exactly 2 steps from r along the cat's ways: where a pounce can land.
  function leaps(G, r) {
    const one = next(G, r, false), two = new Set();
    for (const x of one) for (const y of next(G, x, false)) if (y !== r && !one.includes(y)) two.add(y);
    return Array.from(two).sort((x, y) => x - y);
  }
  // Where the mouse can go this turn: one step by any way, never into the cat's room.
  const mouseMoves = (G) => next(G, G.m, true).filter((r) => r !== G.c);
  // Rooms up to 2 steps from r for a decoy crumb. Not the cat's room: the cat would know it was fake.
  function near(G, r) {
    const s = new Set();
    for (const x of next(null, r, true)) { s.add(x); for (const y of next(null, x, true)) s.add(y); }
    s.delete(r); s.delete(G.c);
    return Array.from(s).sort((x, y) => x - y);
  }
  // A crumb shows up for the cat DELAY turns after it was dropped, or as soon as the cat finds it.
  const shows = (G, c) => c.seen || c.t <= G.turn - DELAY;

  // Log entry: [id, seat, kind, data, seats allowed to see the data (null = everyone)]
  function note(G, seat, kind, data, vis) {
    G.nid += 1;
    G.log.push([G.nid, seat, kind, data == null ? '' : data, vis || null]);
    if (G.log.length > 24) G.log.shift();
  }
  function deal(G, seat) {
    const d = G.decks[seat === G.mouse ? 'mouse' : 'cat'];
    if (d.length) G.hands[seat].push(d.pop());
  }

  function newGame(names, rnd, prev) {
    rnd = rnd || Math.random;
    const G = {
      names: names.slice(0, 2), score: [0, 0], rounds: [], round: 0, log: [],
      first: prev ? 1 - prev.first : Math.floor(rnd() * 2), // who is the mouse in round 1
      win: -1, deadline: null, nid: prev ? prev.nid : 0, gid: prev ? prev.gid + 1 : 1
    };

  }
  function startRound(G, rnd) {

      G.decks[role] = shuffle(d, rnd);

    G.cup = false; G.nap = false;

  const needsAct = (G) => G.ph === 'hide' || G.ph === 'mouse' || G.ph === 'cat';
  const actor = (G) => (G.ph === 'cat' ? G.cat : G.mouse);

  // Stops a seat's move clock from running down, e.g. while that player is disconnected.
  function hold(G, seat, ms) {
    if (G.deadline != null && needsAct(G) && actor(G) === seat) G.deadline += ms;
  }

  // Applies one action from a seat and restarts the move clock. Returns {ok} or {err}.
  function dispatch(G, seat, a, now, rnd) {
    const r = apply(G, seat, a, now, rnd);
    if (r.ok) arm(G, now);

  }

  function timeout(G, now, rnd) {

    if (G.ph === 'hide') apply(G, s, { t: 'hide', room: STARTS[Math.floor(rnd() * STARTS.length)] }, now, rnd);

    rnd = rnd || Math.random;

    if (G.ph === 'over') return err('The game is over.');

      case 'hide': {
        if (G.ph !== 'hide' || seat !== G.mouse) return err('Not now.');
        const r = Number(a.room);
        if (!STARTS.includes(r)) return err('Come out at one end of a mouse hole.');
        G.m = r; G.path = [r]; G.ph = 'mouse';
        note(G, seat, 'hide', r, [seat]);
        return { ok: true };
      }
      case 'move': {
        if (G.ph !== 'mouse' || seat !== G.mouse) return err('It is not your turn.');
        const card = a.card ? String(a.card) : '';
        if (card && (!MOUSE_CARDS.includes(card) || !hand.includes(card))) return err('You do not have that card.');
        const from = G.m, to = Number(a.to);
        const opts = mouseMoves(G);
        if (card === 'freeze' || !opts.length) {

          if (card === 'freeze' && G.c === from) return err('The cat is right here. Run!');
        } else if (!opts.includes(to)) return err('You can’t get there from here.');
        let at = -1;
        if (card === 'decoy') {
          at = Number(a.at);
          if (!near(G, from).includes(at)) return err('Drop the fake crumb up to 2 rooms from you.');
        }
        if (card) { hand.splice(hand.indexOf(card), 1); note(G, seat, 'trick', card, [seat]); }
        if (to !== from && card !== 'tiptoe') G.crumbs.push({ r: from, t: G.turn, fake: false, seen: false });
        if (card === 'decoy') G.crumbs.push({ r: at, t: G.turn, fake: true, seen: false });
        G.m = to; G.path.push(to); G.cup = card === 'teacup';
        note(G, seat, to === from ? 'stay' : 'move', to, [seat]);
        if (a.eat === true && G.cheese.includes(to)) {
          G.cheese.splice(G.cheese.indexOf(to), 1);
          G.eaten += 1;
          note(G, seat, 'nom', to);
          if (!G.cheese.length) { endRound(G, 'feast'); return { ok: true }; }

        G.ph = 'cat'; G.used = false;
        // A cat that pounced last turn sleeps through this one.

      }
      case 'card': {
        if (G.ph !== 'cat' || seat !== G.cat) return err('It is not your turn.');
        if (G.used) return err('One trick card per turn.');
        const card = String(a.card || '');
        if (!CAT_CARDS.includes(card) || !hand.includes(card)) return err('You do not have that card.');
        if (card === 'vase') {
          const to = Number(a.to);
          if (!next(null, G.c, true).includes(to)) return err('Pick a way out of your room.');
          if (isBlocked(G, G.c, to)) return err('That way is already blocked.');
          G.blocked.push([G.c, to, G.turn + VASE]);
          note(G, seat, 'vase', key(G.c, to));
        } else if (card === 'whiskers') note(G, seat, 'whiskers', G.m === G.c || next(null, G.c, true).includes(G.m) ? 1 : 0);
        else if (card === 'meow') note(G, seat, 'meow', Math.floor(G.m / 4));
        else if (card === 'sniff') {

        G.ready[seat] = true;

        return { ok: true };
      }

  }

  // Enforces the move clock. Returns true if state changed.
  function tick(G, now, rnd) {
    rnd = rnd || Math.random;
    if (needsAct(G) && G.deadline == null) { arm(G, now); return true; }
    if (needsAct(G) && now >= G.deadline) { timeout(G, now, rnd); return true; }
    return false;
  }

  // What one seat is allowed to see. The cat never gets the mouse's room, its tricks, fake crumbs
  // or crumbs that haven't shown up yet. Everything is revealed once a round ends.
  function viewFor(G, seat, now) {
    const all = seat === G.mouse || G.ph === 'roundover' || G.ph === 'over';
    const crumbs = G.crumbs.filter((c) => all || shows(G, c))
      .map((c) => [c.r, c.t, all && c.fake ? 1 : 0, shows(G, c) ? 1 : 0])
      .sort((x, y) => x[1] - y[1] || x[0] - y[0]); // fixed order, so a fake crumb can't be told apart by position
    const v = {
      ph: G.ph, you: seat, names: G.names.slice(), round: G.round, turn: G.turn, mouse: G.mouse, cat: G.cat,
      c: G.c, m: all ? G.m : -1, cup: all && G.cup, nap: G.nap, used: G.used,
      cheese: G.cheese.slice(), eaten: G.eaten, score: G.score.slice(), ready: G.ready.slice(),
      hand: G.hands[seat].slice(), counts: G.hands.map((h) => h.length),
      blocked: G.blocked.map((b) => b.slice()), crumbs,
      rounds: G.rounds.map((r) => Object.assign({}, r, { path: r.path.slice() })),
      win: G.win, gid: G.gid,
      dl: G.deadline != null && needsAct(G) ? Math.max(0, G.deadline - now) : null
    };
    v.log = G.log.slice(-14).map((e) => {
      const hide = e[4] && !e[4].includes(seat);
      return [e[0], e[1], hide ? MASK[e[2]] || e[2] : e[2], hide ? '?' : e[3]];
    });
    return v;
  }

  const Engine = {
    TURN_MS, NIGHT, CHEESE, DELAY, CATCH, DRAWS, VASE, ROOMS, FLOORS, DOORS, STAIRS, HOLES, STARTS, DEN, MOUSE_CARDS, CAT_CARDS,
    newGame, dispatch, tick, hold, actor, needsAct, viewFor, next, leaps, near, mouseMoves, isHole, isBlocked, key

    if (el.innerHTML !== html) { el.innerHTML = html; el.scrollTop = el.scrollHeight; }

  }
  function clockHTML(v) {
    const turn = `Round ${v.round} of 2 · turn ${v.turn} of ${E.NIGHT}`;
    if (v.dl == null) return `<p class="clock">${turn}</p>`;
    return `<p class="clock">${turn} · <b class="${v.paused ? '' : 'clockv'}">${v.paused ? 'paused' : Math.ceil(v.dl / 1000) + 's'}</b></p>`;
  }
  function statusHTML(v) {
    const isMouse = v.you === v.mouse;

    else if (v.ph === 'mouse') { t = isMouse ? 'Your move' : 'The mouse is sneaking…'; s = isMouse ? (v.nap ? 'The cat is napping after its pounce. Go!' : 'The cat can’t see you. It sees your crumbs 2 turns late.') : 'If a cheese vanishes, you’ll know where it is.'; }
    else if (v.ph === 'cat') { t = isMouse ? 'The cat is hunting…' : 'Your move'; s = isMouse ? 'It can’t see you. Hold your breath.' : 'Walk, pounce or stay. Land on the mouse to catch it.'; }
    else if (v.ph === 'roundover') t = 'Round over';
    else t = v.win === -2 ? 'It’s a tie!' : v.win === v.you ? 'You win!' : nm(v, v.win) + ' wins!';
    const yours = live(v) && (v.ph === 'cat' ? !isMouse : isMouse);
    return `<p class="st-title ${yours ? 'me' : ''}">${t}</p>${s ? `<p class="st-sub">${s}</p>` : ''}${clockHTML(v)}`;
  }
  function scoreTile(v, s) {
    const role = s === v.mouse ? 'mouse' : 'cat';
    const acting = live(v) && E.actor(v) === s;
    let tags = `<span class="pill ${role}">${role}</span>`;
    if (s !== v.you) tags += `<span class="pill">${v.counts[s]} trick${v.counts[s] === 1 ? '' : 's'}</span>`;
    if (s !== v.you && !isHere(s)) tags += '<span class="pill awayp">away</span>';
    return `<div class="tile ${acting ? 'active' : ''}">
      <svg class="face" viewBox="0 0 132 104" aria-hidden="true"><use href="#tok-${role}" width="132" height="104"/></svg>
      <div class="who"><span class="nm">${s === v.you ? 'You' : nm(v, s)}</span><span class="tags">${tags}</span></div>
      <b class="pts" aria-label="${v.score[s]} points">${v.score[s]}</b>

  }
  function handHTML(v) {
    const counts = {};
    for (const c of v.hand) counts[c] = (counts[c] || 0) + 1;
    let s = '';
    for (const c of Art.ORDER) if (counts[c]) {

    }
    return s ? `<div class="hand">${s}</div>` : `<div class="hand none">No trick cards</div>`;
  }
  // The text and buttons under the house: what you can do right now.
  function controls(v) {
    const isMouse = v.you === v.mouse;
    const cardInfo = (c) => `<b>${NAME[c]}</b><br>${TEXT[c]}`;
    const fallback = focus && v.hand.includes(focus) ? cardInfo(focus) : 'Your trick cards. Tap one to read it.';
    if (!live(v)) return { info: fallback, dim: true, one: true, btns: `<p class="waitline">${v.ph === 'over' ? 'Game over' : 'Round over'}</p>` };
    if (!myTurn(v)) {
      const wait = busy ? 'Sending…' : v.ph === 'hide' ? 'The mouse is picking a mouse hole…' : v.ph === 'cat' ? 'The cat is hunting…' : 'The mouse is sneaking…';
      return { info: fallback, dim: !focus, one: true, btns: `<p class="waitline">${wait}</p>` };
    }

      if (pick.card === 'decoy' && pick.at < 0) return { info: '<b>Decoy Crumb</b><br>Tap a pink room to drop the fake crumb there.', one: true, btns: `<button class="btn" disabled>Pick a room for the crumb</button>` };
      if (to < 0) return { info, one: true, btns: `<button class="btn" disabled>Pick a room</button>` };
      const verb = to === v.m ? 'Stay in' : 'Go to';
      if (v.cheese.includes(to)) {
        info += ' Eating the cheese tells the cat where you are.';
        return { info, btns: `<button class="btn" data-act="go">${verb} the ${ROOM[to]}</button><button class="btn hot" data-act="go" data-eat="1">…and eat the cheese!</button>` };
      }

    if (pick.card) return { info: cardInfo(pick.card), btns: `<button class="btn ghost" data-act="cancel">Cancel</button><button class="btn hot" data-act="go">Use it</button>` };
    const info = v.used ? 'Now walk, pounce or stay.' : 'Tap a room to walk there, or switch on Pounce to leap 2 rooms (then you nap a turn). Tap a trick card to use it first.';

    else if (pick.to < 0) main = `<button class="btn hot" data-act="go">Stay in the ${ROOM[v.c]}</button>`;

    return { info, btns: `<button class="btn ${pick.pounce ? 'on' : 'ghost'}" data-act="pounce" aria-pressed="${pick.pounce}">Pounce: ${pick.pounce ? 'on' : 'off'}</button>${main}` };
  }
  function tableHTML(v) {
    const me = v.you, op = 1 - me;
    let notice = '';
    if (v.ph !== 'over') {
      if (mode === 'guest' && !hostHere) notice = `Can’t reach ${nm(v, 0)}, who is hosting. Their screen may be off. The game carries on when they’re back.`;
      else if (mode === 'host' && !isHere(op)) notice = `${nm(v, op)} lost connection. Their clock is paused until they come back.`;
    }

  function renderScreen() {
    const el = $('#screen');
    let key = screen;
    if (screen === 'join') key += ':' + full + ':' + hostHere + ':' + (Date.now() - lookStart > 8000) + ':' + JSON.stringify(lobbyInfo);
    if (screen === 'hostwait') key += ':' + code;
    if (screen === 'lobby') key += ':' + roomState;
    if (screen === 'table') {
      if (!V) return;
      el.innerHTML = tableHTML(V);
      screenKey = 'table';
      return;
    }
    if (key === screenKey) return;
    screenKey = key;
    if (screen === 'lobby') el.innerHTML = lobbyHTML();
    else if (screen === 'hostwait') el.innerHTML = hostWaitHTML();

    else if (screen === 'closed') el.innerHTML = closedHTML();
  }

  // ---------- modals ----------
  function sheet(title, body, cls) { return `<div class="sheet ${cls || ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">${body}</div>`; }
  function revealMap(v, r) {
    return Art.map({
      c: v.c, m: r.at, cheese: v.cheese, crumbs: crumbList(v), blocked: [], turn: r.turn, sun: r.why === 'sunrise',
      path: r.path, label: 'Where the mouse went'
    });
  }
  function roundLine(v, r, i) {
    const who = r.mouse === v.you ? 'You' : nm(v, r.mouse);
    const end = r.why === 'caught' ? `, then got caught (+${E.CATCH} for the cat)` : r.why === 'feast' ? ' and cleared the house' : '';
    return `<li>Round ${i + 1}: ${who} ate ${r.eaten} cheese as the mouse${end}.</li>`;
  }
  function modalSpec() {
    if (local && local.k === 'rules') return { key: 'rules', html: rulesHTML() };
    if (local && local.k === 'exit') {
      const hostName = V ? nm(V, 0) : 'your friend';
      return { key: 'exit', html: mode === 'host'
        ? sheet('Close room', `<h2>Close this room?</h2><p class="sub">The game ends for both of you and the code stops working.</p><div class="btns"><button class="btn hot" data-act="closeroom">Close room</button><button class="btn ghost ink" data-act="close">Keep playing</button></div>`)
        : sheet('Leave game', `<h2>Leave the game?</h2><p class="sub">You can come back with the same code while ${hostName} keeps the room open.</p><div class="btns"><button class="btn hot" data-act="closeroom">Leave</button><button class="btn ghost ink" data-act="close">Stay</button></div>`) };
    }
    if (screen !== 'table' || !V) return null;
    const v = V, me = v.you;
    if ((v.ph === 'roundover' || v.ph === 'over') && v.rounds.length) {
      const r = v.rounds[v.rounds.length - 1], mine = r.mouse === me;
      const mWho = mine ? 'You' : nm(v, r.mouse), cWho = mine ? nm(v, r.mouse === 0 ? 1 : 0) : 'You';
      const head = r.why === 'caught' ? (mine ? 'Caught!' : 'Got the mouse!') : r.why === 'feast' ? 'All the cheese is gone!' : 'Sunrise!';
      const ate = `${mWho} ate ${r.eaten} cheese${r.why === 'caught' ? ` before getting caught in the ${ROOM[r.at]}` : ''}.`;
      const bonus = r.why === 'caught' ? ` ${cWho} ${cWho === 'You' ? 'score' : 'scores'} ${E.CATCH} for the catch.` : '';
      const scores = `<div class="scoreline">${[me, 1 - me].map((s) => `<span>${s === me ? 'You' : nm(v, s)}<b>${v.score[s]}</b></span>`).join('')}</div>`;

          <div class="btns one"><button class="btn hot" data-act="next" ${ready || busy ? 'disabled' : ''}>${ready ? `Waiting for ${nm(v, 1 - me)}…` : 'Start round 2'}</button></div>`, 'over') };
      }
      const title = v.win === -2 ? 'It’s a tie!' : v.win === me ? 'You win!' : `${nm(v, v.win)} wins!`;

        <p class="eyebrow ink">${head}</p>

        <p class="sub">${ate}${bonus}</p>

  function rulesHTML() {
    const row = (t) => `<li>${cardSVG(t, 'tiny')}<div><b>${NAME[t]}</b><br>${TEXT[t]}</div></li>`;
    return sheet('How to play', `<h2>How to play</h2>
      <p class="sub">One of you is a mouse sneaking through a sleeping house to eat cheese. The other is the cat. Only the mouse’s phone shows where the mouse is. You play 2 rounds and swap roles in between.</p>
      <ol class="steps">
        <li>The mouse comes out of one of the 4 mouse holes. The cat starts on the Landing.</li>
        <li>Each turn the mouse moves first: through a doorway, up or down the stairs, or through a mouse hole inside the outer walls. It has to move, and it can’t go into the cat’s room.</li>
        <li>If the mouse moves into a room with cheese, it can eat it. The cheese disappears on both phones, so the cat knows exactly where the mouse is.</li>
        <li>Then the cat walks one room, stays, or pounces on a room 2 steps away and naps through its next turn. Cats don’t fit through mouse holes. If the cat lands in the mouse’s room, the mouse is caught.</li>
        <li>Every room the mouse leaves gets a crumb. The cat sees crumbs 2 turns late, and the number on a crumb says how many turns ago the mouse left. If the cat walks into a room with fresh crumbs, it sees them straight away.</li>

      <p class="sub"><b>Trick cards.</b> You start each round with 2 and get 1 more on turns ${E.DRAWS.join(' and ')}. You can use one per turn. You can see how many the other player has, but not which ones.</p>
      <p class="sub"><b>On the mouse’s phone</b>, faded crumbs are ones the cat can’t see yet, and pink ones are fakes.</p>

  function renderModal() {
    const spec = modalSpec();
    const m = $('#modal');
    if (!spec) { if (modalKey) { m.hidden = true; m.innerHTML = ''; modalKey = ''; } return; }
    if (spec.key === modalKey) return;
    modalKey = spec.key;
    m.innerHTML = spec.html;
    m.hidden = false;

  // ---------- countdown + toast ----------
  function tickCountdown() {
    if (!clockEnd) return;
    const secs = Math.max(0, Math.ceil((clockEnd - Date.now()) / 1000));
    document.querySelectorAll('.clockv').forEach((el) => { el.textContent = secs + 's'; el.parentNode.classList.toggle('urgent', secs <= 10); });
  }
  let toastT = 0;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastT);
    toastT = setTimeout(() => { t.hidden = true; }, 3200);
  }

  // ---------- input ----------
  document.addEventListener('input', (e) => {
    if (e.target.id === 'name') { myName = clean(e.target.value); store.set('mc-name', myName); e.target.classList.remove('missing'); }
    if (e.target.id === 'code') e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  });
  document.addEventListener('submit', (e) => {
    if (e.target.id !== 'chatform') return;
    e.preventDefault();
    const inp = $('#chatin');
    if (sendChat(inp.value)) { inp.value = ''; inp.focus(); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.id === 'code') { e.preventDefault(); const b = $('[data-act="join"]'); if (b) b.click(); }
    if (e.key === 'Escape' && local) { local = null; render(); }
    // Rooms on the map are SVG shapes, so make Enter and Space press them like buttons.
    if ((e.key === 'Enter' || e.key === ' ') && e.target instanceof SVGElement && e.target.dataset.act) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
  });
  function takeName() {
    const inp = $('#name');
    const n = clean(inp ? inp.value : myName);
    if (!n) {
      toast('Add your name first.');
      if (inp) { inp.classList.add('missing'); inp.focus(); }
      return false;
    }
    myName = n; store.set('mc-name', myName);
    return true;
  }
  function copyText(text, done) {
    try { navigator.clipboard.writeText(text).then(done, () => toast('Copy did not work. The code is ' + code)); } catch (err) { toast('The code is ' + code); }
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const a = b.dataset.act, t = b.dataset.t;
    switch (a) {
      case 'host': if (!takeName()) return; hostStart(null); break;
      case 'join': {
        if (!takeName()) return;
        const c = (($('#code') || {}).value || '').toUpperCase();
        if (!/^[A-Z0-9]{4}$/.test(c)) { toast('Type the 4-character code from your friend.'); return; }
        guestJoin(c);
        break;
      }
      case 'resume': { if (!takeName()) return; const r = store.get('mc-host'); if (r) hostStart(r); break; }
      case 'rejoin': { if (!takeName()) return; const r = store.get('mc-guest'); if (r) guestJoin(r.code); break; }
      case 'exit': local = { k: 'exit' }; render(); break;
      case 'closeroom': local = null; leave(); break;
      case 'menu': screen = 'lobby'; screenKey = ''; render(); break;
      case 'leave': leave(); break;
      case 'copy': copyText(code, () => toast('Code copied')); break;
      case 'share': {
        const url = location.origin + location.pathname + '#' + code;
        if (navigator.share) navigator.share({ title: 'Midnight Crumbs', text: 'Play Midnight Crumbs with me! Game code ' + code, url }).catch(() => { });
        else copyText(url, () => toast('Invite link copied'));
        break;
      }
      case 'rules': local = { k: 'rules' }; render(); break;
      case 'log': local = { k: 'log' }; render(); break;
      case 'close': local = null; render(); break;
      case 'room': tapRoom(Number(b.dataset.r)); break;
      case 'card': tapCard(t); break;
      case 'pounce': pick.pounce = !pick.pounce; pick.to = -1; render(); break;
      case 'cancel': pick.card = ''; pick.at = -1; render(); break;
      case 'go': go(b.dataset.eat === '1'); break;
      case 'next': doAct({ t: 'next' }); break;
      case 'again': doAct({ t: 'again' }); break;
      case 'chat': local = { k: 'chat' }; if (V) chatSeen = (V.chat || []).reduce((m, c) => Math.max(m, c[2]), 0); render(); setTimeout(() => { const i = $('#chatin'); if (i && window.matchMedia('(pointer: fine)').matches) i.focus(); }, 50); break;
      case 'quick': sendChat(b.dataset.q); break;
    }
  });

  // ---------- timers ----------
  let lastTick = Date.now();
  function hostTick() {
    const now = Date.now();
    if (mode === 'host' && G) {
      // A disconnected player's clock stands still.
      G.cids.forEach((c, s) => { if (!isHere(s)) E.hold(G, s, now - lastTick); });
      if (E.tick(G, now)) commit();
    }
    lastTick = now;
  }
  setInterval(() => {
    hostTick();
    tickCountdown();
    if (screen === 'join') renderScreen();
  }, 150);
  document.addEventListener('visibilitychange', () => { hostTick(); keepAwake(); });

  // Keep the screen on while in a game: a locked phone drops the connection, and the host's phone runs the game.
  let wakeLock = null, wakeAsk = false;
  function keepAwake() {
    const wantLock = !!mode && document.visibilityState === 'visible';
    if (wantLock && !wakeLock && !wakeAsk && navigator.wakeLock) {
      wakeAsk = true;
      navigator.wakeLock.request('screen').then((l) => {
        wakeAsk = false; wakeLock = l;
        l.addEventListener('release', () => { if (wakeLock === l) wakeLock = null; });
        if (!mode) keepAwake();
      }, () => { wakeAsk = false; });
    } else if (!wantLock && wakeLock) { const l = wakeLock; wakeLock = null; l.release().catch(() => { }); }
  }

  // ---------- boot ----------
  async function boot() {
    document.body.insertAdjacentHTML('afterbegin', Art.sprite());
    render();
    await Crypt.init();
    const r = window.MC_ROOM();
    room = r;
    roomState = r ? (r.connected() ? 'on' : 'connecting') : 'off';
    if (!r) { screenKey = ''; render(); return; }
    const onErr = () => { roomState = 'off'; screenKey = ''; render(); };
    if (r.onIssue) r.onIssue((t) => {
      if (t === 'code-taken' && mode === 'host' && !G) { code = newCode(); screenKey = ''; commit(); }
      else if (t === 'server') toast('Can’t reach the matchmaking server. Retrying…');
      else if (t === 'ice-failed') toast('Your networks are blocking a direct connection. Try switching one phone to mobile data or another Wi-Fi.');
      else if (t === 'browser') toast('This browser can’t make direct connections. Try Chrome or Safari.');
    });
    r.onConnection((c) => {
      const ns = c ? 'on' : (roomState === 'off' ? 'off' : 'connecting');
      if (ns !== roomState) { roomState = ns; screenKey = ''; }
      if (c && mode === 'host') hostPublish();
      if (c && mode === 'guest') guestPublish();
      render();
    }, onErr);
    r.onPeers(() => {
      if (mode === 'host') hostOnPeers();
      else if (mode === 'guest') guestOnPeers();
    }, onErr);
    // connected() can be false for a moment at load; allow starting anyway after a short wait
    setTimeout(() => { if (roomState === 'connecting' && room) { roomState = 'on'; screenKey = ''; render(); } }, 3000);
    screenKey = '';
    render();
  }
  boot();
})();
</script>
</body>
</html>
